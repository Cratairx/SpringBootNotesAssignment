<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<form method="post" th:action="@{/editnote}">
    <p>Username: <span th:text="${username}"></span></p>
    <p>Edit note sidan. ta bort detta sen</p>
    <input type="hidden" name="id" th:value="${note.id}" >
    <div class = "form-group">
    <input type="text" name="title" th:value="${note.title}">
    </div>
    <div class = "form-group">
    <textarea name="content" th:text="${note.content}"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Spara</button>



</form>
</body>
</html>
