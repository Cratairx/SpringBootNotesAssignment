<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mina anteckningar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<p>Hej <span th:text="${username}"></span>!</p>
<p>Detta är show all usernotes sidan ska fixas</p>

<div th:each="note : ${notes}">
    <h2 th:text="${note.title}"></h2>
    <p th:text="${note.content}"></p>
    <a class="btn btn-primary" th:href ="@{/editnote(id=${note.id})}">Edit</a>
    <a class="btn btn-danger" th:href ="@{/delete(id=${note.id})}">Delete</a>
    <hr>


</div>



<div class = "d-flex flex-column" style="width: fit-content;">
    <a class="btn btn-primary" th:href="@{/adminpage}">Backa</a>
</div>

</body>
</html>
