<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mina anteckningar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<p>Hej <span th:text="${username}"></span>!</p>
<p>Detta är show all usernotes sidan ska fixas</p>

    <form method="post" th:action="@{/showUserNotes}">
        <p>Username: <span th:text="${username}"></span></p>
        <div class = "form-group">
            <input type="text" name="title" placeholder="Title">
        </div>
        <div class = "form-group">
            <textarea name="content" placeholder="Write your note..."></textarea>
        </div>
        <button type="submit" class ="btn btn-primary">Save</button>



<div class = "d-flex flex-column" style="width: fit-content;">
    <a class="btn btn-primary" th:href="@{/success}">Backa</a>
</div>

</body>
</html>
