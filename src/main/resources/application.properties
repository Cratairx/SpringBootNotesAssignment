spring.application.name=SpringBootNotesAssignment
spring.datasource.url=jdbc:mysql://localhost:3306/secure_notes
spring.datasource.username=root
spring.datasource.password=SecretPassword!

spring.security.oauth2.client.registration.azure.client-id=DITT-PROGRAM-ID
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET}
spring.security.oauth2.client.registration.azure.scope=openid,profile,email
spring.security.oauth2.client.provider.azure.issuer-uri=https://login.microsoftonline.com/DITT-KATALOG-ID/v2.0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false